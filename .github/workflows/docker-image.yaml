name: Docker image

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Describe image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CLIENT_SANITY_PROJECT_ID=${{ vars.CLIENT_SANITY_PROJECT_ID }}
            CLIENT_SANITY_DATASET=${{ vars.CLIENT_SANITY_DATASET }}
            CLIENT_SANITY_API_VERSION=${{ vars.CLIENT_SANITY_API_VERSION }}
            CLIENT_SANITY_USE_CDN=${{ vars.CLIENT_SANITY_USE_CDN }}
            CLIENT_FINANCE_API_BASE_URL=${{ vars.CLIENT_FINANCE_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
